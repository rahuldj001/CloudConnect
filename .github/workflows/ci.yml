name: CloudConnect CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-checks:
    name: Backend Lint, Type Check & Pytest Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest-cov

      - name: Run Backend Unit & Integration Tests
        env:
          DATABASE_URL: sqlite+aiosqlite:///./test_ci.db
          SECRET_KEY: ci-secret-jwt-key-not-for-production-usage
          ENVIRONMENT: test
          PROVIDER_TYPE: simulator
        run: |
          cd backend
          python -m pytest -v --tb=short

  frontend-checks:
    name: Frontend Lint, Vitest Suite & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Run Vitest Suite (Unit & Component RTL Tests)
        run: |
          cd frontend
          npm test

      - name: TypeScript Verification & Production Build
        run: |
          cd frontend
          npm run build

version: '3.8'

services:
  # PostgreSQL Database Service
  postgres:
    image: postgres:15-alpine
    container_name: cloudconnect-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cloudconnect}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cloudconnect_secret}
      POSTGRES_DB: ${POSTGRES_DB:-cloudconnect}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cloudconnect} -d ${POSTGRES_DB:-cloudconnect}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cloudconnect-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-cloudconnect}:${POSTGRES_PASSWORD:-cloudconnect_secret}@postgres:5432/${POSTGRES_DB:-cloudconnect}
      SECRET_KEY: ${SECRET_KEY:-cloudconnect-development-super-secret-jwt-key-2026}
      ACCESS_TOKEN_EXPIRE_MINUTES: 480
      ENVIRONMENT: production
      CORS_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173"
      PROVIDER_TYPE: simulator
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3
    command: >
      sh -c "python -m app.db.init_db &&
             python -m app.db.seed_data &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  # React Frontend Service (Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cloudconnect-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
    driver: local
